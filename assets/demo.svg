<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Consolas, 'Cascadia Code', monospace">
  <rect x="0" y="0" width="640" height="400" rx="12" fill="#000000"/>
  <rect x="0" y="0" width="640" height="400" rx="12" fill="none" stroke="#E8A07E" stroke-opacity="0.3"/>
  <circle cx="28" cy="26" r="6" fill="#E8A07E" opacity="0.85"/>
  <circle cx="48" cy="26" r="6" fill="#7fb069" opacity="0.85"/>
  <circle cx="68" cy="26" r="6" fill="#B08D87" opacity="0.85"/>
  <text x="96" y="31" font-size="14" fill="#B08D87">mev — how it works</text>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.3s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="4.4s" dur="0.3s" fill="freeze"/>
    <text x="28" y="66" font-size="12" fill="#B08D87">ACT 1 · DECIDE — text in, verdict out</text>
    <text x="28" y="96" font-size="15" fill="#F3E6E1">$ mev decide "double charge on my invoice"</text>
    <text x="28" y="126" font-size="14" fill="#B08D87">billing 0.93 · technical 0.04 · other 0.03</text>
<rect x="28" y="138" width="200" height="10" rx="5" fill="#1a1a1a"/>
    <rect x="28" y="138" width="0" height="10" rx="5" fill="#7fb069">
      <animate attributeName="width" from="0" to="186" begin="1.6s" dur="0.9s" fill="freeze"/>
    </rect>
    <text x="28" y="172" font-size="15" font-weight="bold" fill="#7fb069">→ billing · conf 0.93 · 0.14ms · no text generated</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="5.0s" dur="0.3s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="9.0s" dur="0.3s" fill="freeze"/>
    <text x="28" y="66" font-size="12" fill="#B08D87">ACT 2 · SFIND — intent in, ranked files out</text>
    <text x="28" y="96" font-size="15" fill="#F3E6E1">$ mev sfind "where is the refund flow?"</text>
    <text x="28" y="126" font-size="14" fill="#B08D87" opacity="0">scanning 490 files…<animate attributeName="opacity" from="0" to="1" begin="5.8s" dur="0.2s" fill="freeze"/></text>
    <text x="28" y="152" font-size="14" fill="#E8A07E" opacity="0">1. refund_service.py · 0.81<animate attributeName="opacity" from="0" to="1" begin="6.6s" dur="0.2s" fill="freeze"/></text>
    <text x="28" y="176" font-size="14" fill="#E8A07E" opacity="0">2. invoice_gen.py · 0.12<animate attributeName="opacity" from="0" to="1" begin="7.2s" dur="0.2s" fill="freeze"/></text>
    <text x="28" y="200" font-size="14" fill="#B08D87" opacity="0">grep on the same intent: 0 results<animate attributeName="opacity" from="0" to="1" begin="7.8s" dur="0.2s" fill="freeze"/></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="9.6s" dur="0.3s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="13.4s" dur="0.3s" fill="freeze"/>
    <text x="28" y="66" font-size="12" fill="#B08D87">ACT 3 · GATE — confidence decides what happens</text>
    <text x="28" y="100" font-size="15" fill="#7fb069">✓ conf ≥ 0.85 → act automatically</text>
    <text x="28" y="130" font-size="15" fill="#E8A07E">○ 0.50–0.84 → show top-3, continue</text>
    <text x="28" y="160" font-size="15" fill="#e07a6a">✗ conf &lt; 0.50 → stop, ask a human</text>
    <text x="28" y="196" font-size="14" fill="#B08D87">no guessing · every answer carries its doubt</text>
  </g>

  <rect x="16" y="384" width="0" height="3" fill="#E8A07E" opacity="0.7">
    <animate attributeName="width" from="0" to="608" begin="0s" dur="14s" repeatCount="indefinite"/>
  </rect>
</svg>
