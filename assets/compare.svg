<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="'Segoe UI', system-ui, sans-serif">
  <rect x="0" y="0" width="760" height="380" rx="12" fill="#000000"/>
  <rect x="0" y="0" width="760" height="380" rx="12" fill="none" stroke="#E8A07E" stroke-opacity="0.3"/>
  <text x="28" y="36" font-size="16" font-weight="600" fill="#F3E6E1">MEV vs the rest</text>
  <text x="28" y="58" font-size="12" fill="#B08D87">measured on the same machine, except hosted APIs</text>

  <text x="28" y="100" font-size="13" font-weight="600" fill="#B08D87">decision latency</text>
  <text x="28" y="118" font-size="11" fill="#5c5c5c">lower is better · √ scale</text>
  <rect x="200" y="88" width="390" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="200" y="88" width="0" height="10" rx="5" fill="#E8A07E"><animate attributeName="width" from="0" to="30" begin="0.4s" dur="0.8s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="200" y="122" font-size="12" fill="#E8A07E" opacity="0">MEV 0.14ms<animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.3s" fill="freeze"/></text>
  <rect x="200" y="132" width="0" height="10" rx="5" fill="#5c5c5c"><animate attributeName="width" from="0" to="100" begin="0.7s" dur="0.8s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="308" y="150" font-size="12" fill="#B08D87" opacity="0">Laya GPU 33ms<animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.3s" fill="freeze"/></text>
  <rect x="200" y="158" width="0" height="10" rx="5" fill="#5c5c5c"><animate attributeName="width" from="0" to="302" begin="1s" dur="0.8s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="510" y="176" font-size="12" fill="#B08D87" opacity="0">Laya CPU ~300ms<animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.3s" fill="freeze"/></text>
  <rect x="200" y="184" width="0" height="10" rx="5" fill="#5c5c5c"><animate attributeName="width" from="0" to="390" begin="1.3s" dur="0.8s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="598" y="202" font-size="12" fill="#B08D87" opacity="0">Jev API 500ms+<animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.3s" fill="freeze"/></text>

  <text x="28" y="238" font-size="13" font-weight="600" fill="#B08D87">intent search · 490 files</text>
  <text x="28" y="256" font-size="11" fill="#5c5c5c">lower is better · linear</text>
  <rect x="200" y="226" width="390" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="200" y="226" width="0" height="10" rx="5" fill="#E8A07E"><animate attributeName="width" from="0" to="239" begin="2.3s" dur="0.8s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="447" y="244" font-size="12" fill="#E8A07E" opacity="0">MEV ~80ms<animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.3s" fill="freeze"/></text>
  <rect x="200" y="252" width="0" height="10" rx="5" fill="#5c5c5c"><animate attributeName="width" from="0" to="390" begin="2.6s" dur="0.8s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="598" y="270" font-size="12" fill="#B08D87" opacity="0">grep ~131ms · 0 hits<animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.3s" fill="freeze"/></text>

  <text x="28" y="306" font-size="13" font-weight="600" fill="#B08D87">accuracy · narrow tasks</text>
  <text x="28" y="324" font-size="11" fill="#5c5c5c">higher is better · linear</text>
  <rect x="200" y="294" width="390" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="200" y="294" width="0" height="10" rx="5" fill="#E8A07E"><animate attributeName="width" from="0" to="340" begin="3.6s" dur="0.8s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="548" y="312" font-size="12" fill="#E8A07E" opacity="0">MEV 87%<animate attributeName="opacity" from="0" to="1" begin="4.3s" dur="0.3s" fill="freeze"/></text>
  <rect x="200" y="320" width="0" height="10" rx="5" fill="#5c5c5c"><animate attributeName="width" from="0" to="234" begin="3.9s" dur="0.8s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="442" y="338" font-size="12" fill="#B08D87" opacity="0">Laya ~60%<animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.3s" fill="freeze"/></text>
  <rect x="200" y="346" width="0" height="6" rx="3" fill="none" stroke="#5c5c5c"><animate attributeName="width" from="0" to="390" begin="4.2s" dur="0.8s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="442" y="364" font-size="12" fill="#B08D87" opacity="0">ripgrep 100%*<animate attributeName="opacity" from="0" to="1" begin="4.9s" dur="0.3s" fill="freeze"/></text>
  <text x="540" y="364" font-size="11" fill="#5c5c5c" opacity="0">*if the string exists<animate attributeName="opacity" from="0" to="1" begin="5.2s" dur="0.4s" fill="freeze"/></text>
</svg>
