<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="'Segoe UI', system-ui, sans-serif">
  <rect x="0" y="0" width="760" height="440" rx="12" fill="#000000"/>
  <rect x="0" y="0" width="760" height="440" rx="12" fill="none" stroke="#E8A07E" stroke-opacity="0.3"/>
  <text x="36" y="42" font-size="17" font-weight="600" fill="#F3E6E1">MEV vs the rest — watch them run</text>
  <text x="36" y="64" font-size="12" fill="#B08D87">same machine, except hosted APIs · dot speed ≈ real pace</text>

  <text x="36" y="102" font-size="13" font-weight="600" fill="#B08D87">race 1 · one decision</text>
  <text x="36" y="130" font-size="12" fill="#E8A07E">MEV</text>
  <line x1="150" y1="126" x2="620" y2="126" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="620" y1="118" x2="620" y2="134" stroke="#E8A07E" stroke-width="2"/>
  <circle cx="150" cy="126" r="6" fill="#E8A07E">
    <animate attributeName="cx" from="150" to="620" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0.2;1" keyTimes="0;0.85;0.95;1" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <text x="628" y="130" font-size="12" fill="#E8A07E">0.14ms<animate attributeName="opacity" values="1;0.6;1" keyTimes="0;0.5;1" dur="2.4s" repeatCount="indefinite"/></text>
  <text x="36" y="156" font-size="12" fill="#B08D87">Laya GPU</text>
  <line x1="150" y1="152" x2="620" y2="152" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="620" y1="144" x2="620" y2="160" stroke="#5c5c5c" stroke-width="2"/>
  <circle cx="150" cy="152" r="6" fill="#8a8a8a">
    <animate attributeName="cx" from="150" to="620" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="628" y="156" font-size="12" fill="#B08D87">33ms</text>
  <text x="36" y="182" font-size="12" fill="#B08D87">Laya CPU</text>
  <line x1="150" y1="178" x2="620" y2="178" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="620" y1="170" x2="620" y2="186" stroke="#5c5c5c" stroke-width="2"/>
  <circle cx="150" cy="178" r="6" fill="#8a8a8a">
    <animate attributeName="cx" from="150" to="620" dur="3.4s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <text x="628" y="182" font-size="12" fill="#B08D87">~300ms</text>
  <text x="36" y="208" font-size="12" fill="#B08D87">Jev API</text>
  <line x1="150" y1="204" x2="620" y2="204" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="620" y1="196" x2="620" y2="212" stroke="#5c5c5c" stroke-width="2"/>
  <circle cx="150" cy="204" r="6" fill="#8a8a8a">
    <animate attributeName="cx" from="150" to="620" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <text x="628" y="208" font-size="12" fill="#B08D87">500ms+</text>

  <text x="36" y="250" font-size="13" font-weight="600" fill="#B08D87">race 2 · intent search, 490 files</text>
  <text x="36" y="278" font-size="12" fill="#E8A07E">MEV</text>
  <line x1="150" y1="274" x2="620" y2="274" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="620" y1="266" x2="620" y2="282" stroke="#E8A07E" stroke-width="2"/>
  <circle cx="150" cy="274" r="6" fill="#E8A07E">
    <animate attributeName="cx" from="150" to="620" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0.2;1" keyTimes="0;0.85;0.95;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="628" y="278" font-size="12" fill="#E8A07E">~80ms · 3 hits<animate attributeName="opacity" values="1;0.6;1" keyTimes="0;0.5;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></text>
  <text x="36" y="304" font-size="12" fill="#B08D87">grep</text>
  <line x1="150" y1="300" x2="620" y2="300" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="620" y1="292" x2="620" y2="308" stroke="#5c5c5c" stroke-width="2"/>
  <circle cx="150" cy="300" r="6" fill="none" stroke="#8a8a8a" stroke-width="2">
    <animate attributeName="cx" from="150" to="620" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <text x="628" y="304" font-size="12" fill="#B08D87">~131ms · 0 hits</text>

  <text x="36" y="346" font-size="13" font-weight="600" fill="#B08D87">accuracy · narrow tasks — first to the line wins</text>
  <rect x="150" y="358" width="470" height="8" rx="4" fill="#1a1a1a"/>
  <rect x="150" y="358" width="409" height="8" rx="4" fill="#E8A07E"><animate attributeName="width" from="0" to="409" begin="0.5s" dur="0.9s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="150" y="384" font-size="12" fill="#E8A07E" opacity="1">MEV 87%<animate attributeName="opacity" values="0;1" keyTimes="0;1" begin="1.3s" dur="0.3s" fill="freeze"/></text>
  <rect x="150" y="392" width="470" height="8" rx="4" fill="#1a1a1a"/>
  <rect x="150" y="392" width="282" height="8" rx="4" fill="#5c5c5c"><animate attributeName="width" from="0" to="282" begin="0.8s" dur="0.9s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="150" y="418" font-size="12" fill="#B08D87">Laya ~60% · ripgrep 100% only if the string exists</text>
</svg>
