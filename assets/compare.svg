<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="'Segoe UI', system-ui, sans-serif">
  <rect x="0" y="0" width="760" height="460" rx="12" fill="#000000"/>
  <rect x="0" y="0" width="760" height="460" rx="12" fill="none" stroke="#E8A07E" stroke-opacity="0.3"/>
  <text x="36" y="40" font-size="17" font-weight="600" fill="#F3E6E1">MEV vs the rest</text>
  <text x="36" y="62" font-size="12" fill="#B08D87">measured on the same machine, except hosted APIs</text>

  <text x="36" y="104" font-size="14" font-weight="600" fill="#B08D87">decision latency · lower is better · √ scale</text>
  <rect x="36" y="116" width="420" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="36" y="116" width="0" height="10" rx="5" fill="#E8A07E"><animate attributeName="width" from="0" to="32" begin="0.4s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="36" y="150" font-size="13" fill="#E8A07E" opacity="0">MEV — 0.14ms<animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.3s" fill="freeze"/></text>
  <rect x="36" y="162" width="420" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="36" y="162" width="0" height="10" rx="5" fill="#5c5c5c"><animate attributeName="width" from="0" to="108" begin="0.7s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="36" y="196" font-size="13" fill="#B08D87" opacity="0">Laya GPU — 33ms<animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.3s" fill="freeze"/></text>
  <rect x="36" y="208" width="420" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="36" y="208" width="0" height="10" rx="5" fill="#5c5c5c"><animate attributeName="width" from="0" to="326" begin="1s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="36" y="242" font-size="13" fill="#B08D87" opacity="0">Laya CPU — ~300ms<animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.3s" fill="freeze"/></text>
  <rect x="36" y="254" width="420" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="36" y="254" width="0" height="10" rx="5" fill="#5c5c5c"><animate attributeName="width" from="0" to="420" begin="1.3s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="36" y="288" font-size="13" fill="#B08D87" opacity="0">Jev API — 500ms+<animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.3s" fill="freeze"/></text>

  <text x="470" y="104" font-size="14" font-weight="600" fill="#B08D87">intent search · 490 files</text>
  <text x="470" y="124" font-size="11" fill="#5c5c5c">lower is better · linear</text>
  <rect x="470" y="136" width="250" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="470" y="136" width="0" height="10" rx="5" fill="#E8A07E"><animate attributeName="width" from="0" to="153" begin="2.2s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="470" y="170" font-size="13" fill="#E8A07E" opacity="0">MEV — ~80ms<animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.3s" fill="freeze"/></text>
  <rect x="470" y="182" width="250" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="470" y="182" width="0" height="10" rx="5" fill="#5c5c5c"><animate attributeName="width" from="0" to="250" begin="2.5s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="470" y="216" font-size="13" fill="#B08D87" opacity="0">grep — ~131ms · 0 hits<animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.3s" fill="freeze"/></text>

  <text x="470" y="262" font-size="14" font-weight="600" fill="#B08D87">accuracy · narrow tasks</text>
  <text x="470" y="282" font-size="11" fill="#5c5c5c">higher is better · linear</text>
  <rect x="470" y="294" width="250" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="470" y="294" width="0" height="10" rx="5" fill="#E8A07E"><animate attributeName="width" from="0" to="218" begin="3.4s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="470" y="328" font-size="13" fill="#E8A07E" opacity="0">MEV — 87%<animate attributeName="opacity" from="0" to="1" begin="4s" dur="0.3s" fill="freeze"/></text>
  <rect x="470" y="340" width="250" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="470" y="340" width="0" height="10" rx="5" fill="#5c5c5c"><animate attributeName="width" from="0" to="150" begin="3.7s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="470" y="374" font-size="13" fill="#B08D87" opacity="0">Laya — ~60%<animate attributeName="opacity" from="0" to="1" begin="4.3s" dur="0.3s" fill="freeze"/></text>
  <rect x="470" y="386" width="250" height="6" rx="3" fill="none" stroke="#5c5c5c"><animate attributeName="width" from="0" to="250" begin="4s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="470" y="410" font-size="13" fill="#B08D87" opacity="0">ripgrep — 100%*<animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.3s" fill="freeze"/></text>
  <text x="600" y="410" font-size="11" fill="#5c5c5c" opacity="0">*if the string exists<animate attributeName="opacity" from="0" to="1" begin="4.9s" dur="0.4s" fill="freeze"/></text>

  <text x="36" y="330" font-size="12" fill="#B08D87" opacity="0">three dimensions, one story:<animate attributeName="opacity" from="0" to="1" begin="5.2s" dur="0.5s" fill="freeze"/></text>
  <text x="36" y="354" font-size="13" fill="#F3E6E1" opacity="0">fast where it decides,<animate attributeName="opacity" from="0" to="1" begin="5.5s" dur="0.5s" fill="freeze"/></text>
  <text x="36" y="378" font-size="13" fill="#F3E6E1" opacity="0">honest where it doubts.<animate attributeName="opacity" from="0" to="1" begin="5.8s" dur="0.5s" fill="freeze"/></text>
  <text x="36" y="410" font-size="12" fill="#B08D87" opacity="0">cost on every row: $0, offline.<animate attributeName="opacity" from="0" to="1" begin="6.1s" dur="0.5s" fill="freeze"/></text>
  <text x="36" y="440" font-size="12" fill="#E8A07E" opacity="0">numbers, not adjectives.<animate attributeName="opacity" from="0" to="1" begin="6.4s" dur="0.5s" fill="freeze"/></text>
</svg>
