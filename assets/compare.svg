<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="'Segoe UI', system-ui, sans-serif">
  <rect x="0" y="0" width="760" height="470" rx="12" fill="#000000"/>
  <rect x="0" y="0" width="760" height="470" rx="12" fill="none" stroke="#E8A07E" stroke-opacity="0.3"/>
  <text x="36" y="42" font-size="17" font-weight="600" fill="#F3E6E1">MEV vs the rest</text>
  <text x="36" y="64" font-size="12" fill="#B08D87">measured on the same machine, except hosted APIs</text>

  <text x="36" y="106" font-size="14" font-weight="600" fill="#B08D87">decision latency · lower is better · √ scale</text>
  <rect x="36" y="118" width="300" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="36" y="118" width="0" height="10" rx="5" fill="#E8A07E"><animate attributeName="width" from="0" to="26" begin="0.4s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="36" y="148" font-size="13" fill="#E8A07E">MEV — 0.14ms</text>
  <rect x="36" y="160" width="300" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="36" y="160" width="0" height="10" rx="5" fill="#5c5c5c"><animate attributeName="width" from="0" to="77" begin="0.7s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="36" y="190" font-size="13" fill="#B08D87">Laya GPU — 33ms</text>
  <rect x="36" y="202" width="300" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="36" y="202" width="0" height="10" rx="5" fill="#5c5c5c"><animate attributeName="width" from="0" to="232" begin="1s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="36" y="232" font-size="13" fill="#B08D87">Laya CPU — ~300ms</text>
  <rect x="36" y="244" width="300" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="36" y="244" width="0" height="10" rx="5" fill="#5c5c5c"><animate attributeName="width" from="0" to="300" begin="1.3s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="36" y="274" font-size="13" fill="#B08D87">Jev API — 500ms+</text>

  <text x="400" y="106" font-size="14" font-weight="600" fill="#B08D87">intent search · 490 files · lower, linear</text>
  <rect x="400" y="118" width="280" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="400" y="118" width="0" height="10" rx="5" fill="#E8A07E"><animate attributeName="width" from="0" to="171" begin="1.6s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="400" y="148" font-size="13" fill="#E8A07E">MEV — ~80ms</text>
  <rect x="400" y="160" width="280" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="400" y="160" width="0" height="10" rx="5" fill="#5c5c5c"><animate attributeName="width" from="0" to="280" begin="1.9s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="400" y="190" font-size="13" fill="#B08D87">grep — ~131ms · 0 hits</text>

  <text x="400" y="224" font-size="14" font-weight="600" fill="#B08D87">accuracy · narrow tasks · higher, linear</text>
  <rect x="400" y="236" width="280" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="400" y="236" width="0" height="10" rx="5" fill="#E8A07E"><animate attributeName="width" from="0" to="244" begin="2.2s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="400" y="266" font-size="13" fill="#E8A07E">MEV — 87%</text>
  <rect x="400" y="278" width="280" height="10" rx="5" fill="#1a1a1a"/>
  <rect x="400" y="278" width="0" height="10" rx="5" fill="#5c5c5c"><animate attributeName="width" from="0" to="168" begin="2.5s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="400" y="308" font-size="13" fill="#B08D87">Laya — ~60%</text>
  <rect x="400" y="320" width="280" height="6" rx="3" fill="none" stroke="#5c5c5c"><animate attributeName="width" from="0" to="280" begin="2.8s" dur="0.7s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/></rect>
  <text x="400" y="350" font-size="13" fill="#B08D87">ripgrep — 100%*</text>
  <text x="540" y="350" font-size="11" fill="#5c5c5c">*if the string exists</text>

  <text x="36" y="330" font-size="13" fill="#F3E6E1">fast where it decides,</text>
  <text x="36" y="354" font-size="13" fill="#F3E6E1">honest where it doubts.</text>
  <text x="36" y="384" font-size="12" fill="#B08D87">cost on every row: $0, offline.</text>
  <text x="36" y="408" font-size="12" fill="#E8A07E">numbers, not adjectives.</text>
</svg>
