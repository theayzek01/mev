<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" font-family="'Segoe UI', system-ui, sans-serif">
  <rect x="0" y="0" width="760" height="220" rx="12" fill="#000000"/>
  <rect x="0" y="0" width="760" height="220" rx="12" fill="none" stroke="#E8A07E" stroke-opacity="0.3"/>
  <text x="36" y="40" font-size="16" font-weight="600" fill="#F3E6E1">one agent turn, three calls</text>
  <text x="36" y="62" font-size="12" fill="#B08D87">the skill loop: find → judge → act</text>
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="36" y="90" width="150" height="64" rx="10" fill="#0d0d0d" stroke="#E8A07E" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;0.95;0.35" keyTimes="0;0.12;0.3" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="111" y="118" fill="#E8A07E">1 · sfind</text>
    <text x="111" y="138" font-size="11" font-weight="400" fill="#B08D87">3 candidates</text>
    <rect x="226" y="90" width="150" height="64" rx="10" fill="#0d0d0d" stroke="#E8A07E" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;0.35;0.95;0.35" keyTimes="0;0.3;0.42;0.6" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="301" y="118" fill="#E8A07E">2 · decide</text>
    <text x="301" y="138" font-size="11" font-weight="400" fill="#B08D87">billing 0.93</text>
    <rect x="416" y="90" width="150" height="64" rx="10" fill="#0d0d0d" stroke="#E8A07E" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;0.35;0.35;0.95;0.35" keyTimes="0;0.6;0.62;0.74;0.92" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="491" y="118" fill="#E8A07E">3 · act</text>
    <text x="491" y="138" font-size="11" font-weight="400" fill="#B08D87">conf ≥ 0.85</text>
    <rect x="606" y="90" width="118" height="64" rx="10" fill="#0d0d0d" stroke="#E8A07E" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;0.35;0.35;0.35;0.95" keyTimes="0;0.74;0.76;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="665" y="118" fill="#7fb069">done</text>
    <text x="665" y="138" font-size="11" font-weight="400" fill="#B08D87">no guess</text>
  </g>
  <circle r="5" fill="#F3E6E1">
    <animateMotion dur="9s" repeatCount="indefinite" path="M186,122 L226,122 M376,122 L416,122 M566,122 L606,122"/>
  </circle>
  <text x="36" y="190" font-size="12" fill="#B08D87">low confidence anywhere → the loop stops and asks a human.</text>
</svg>
