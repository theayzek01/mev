<svg xmlns="http://www.w3.org/2000/svg" width="260" height="170" viewBox="0 0 260 170">
  <defs>
    <style>
      @font-face {
        font-family: 'Moshra';
        src: url(data:font/otf;base64,) format('opentype');
      }}
    </style>
  </defs>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.9s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.1s" dur="0.9s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/>
    <text x="130" y="122" text-anchor="middle" font-family="Moshra, 'Arial Black', sans-serif" font-size="110" letter-spacing="6" fill="#F3E6E1">ME<tspan dx="-6" fill="#E8A07E" fill-opacity="0.75"><animate attributeName="fill-opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>V</tspan></text>
  </g>
</svg>
